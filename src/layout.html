<script>
document.documentElement.classList.add('js');
/* Motion: Hero-Name und -Fotos bis zum Start von motion.js zurückhalten (max. 2,5 s, nie bei reduzierter Bewegung) */
if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) {
  document.documentElement.classList.add('motion-pending');
  setTimeout(function () { document.documentElement.classList.remove('motion-pending'); }, 2500);
}
/* Schrift-Preload nur auf dem Webserver (file:-Vorschau blockiert crossorigin-Preloads) */
if (location.protocol !== 'file:') ['Newsreader-normal-300-600-latin', 'InstrumentSans-normal-400-700-latin'].forEach(function (f) {
  var l = document.createElement('link'); l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = 'anonymous';
  l.href = '{{root}}assets/fonts/' + f + '.woff2'; document.head.appendChild(l);
});
</script>
<link rel="stylesheet" href="{{root}}assets/css/fonts.css">
<link rel="stylesheet" href="{{root}}assets/css/site.css">
